[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dante-thermo"
version = "1.0.0"
description = "Physics-anchored Transformer for thermospheric neutral-density prediction with calibrated uncertainty"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yinan Wang", email = "wangyinan@mail.iap.ac.cn" }]
keywords = ["thermosphere", "neutral density", "space weather", "satellite drag",
            "machine learning", "transformer", "conformal prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core inference needs only these two.
dependencies = ["torch>=2.0", "numpy>=1.21"]

[project.optional-dependencies]
drivers = ["pandas>=1.3"]   # live GFZ/SWPC driver fetching (dante.drivers)
plot = ["matplotlib>=3.6"]  # optional plotting in the CLI / examples

[project.urls]
Homepage = "https://github.com/IAP-spook/DANTE"
Repository = "https://github.com/IAP-spook/DANTE"

# Command-line tool: `dante-predict ...`
[project.scripts]
dante-predict = "dante.cli:main"

[tool.setuptools]
packages = ["dante"]

# Ship the trained weights inside the wheel so DANTE() works out of the box.
[tool.setuptools.package-data]
dante = ["weights/*.pt", "weights/*.npz", "weights/*.json"]
